    @media (prefers-color-scheme: dark) {
      line { stroke: #fff; }
      circle { fill: #fff; }
    }
  </style>
  <!-- Connection lines -->
  <line x1="6" y1="8" x2="16" y2="5" stroke-width="0.75" opacity="0.3"/>
  <line x1="16" y1="5" x2="26" y2="10" stroke-width="0.75" opacity="0.25"/>
  <line x1="6" y1="8" x2="12" y2="17" stroke-width="0.75" opacity="0.35"/>
  <line x1="16" y1="5" x2="12" y2="17" stroke-width="0.75" opacity="0.2"/>
  <line x1="26" y1="10" x2="22" y2="20" stroke-width="0.75" opacity="0.3"/>
  <line x1="12" y1="17" x2="22" y2="20" stroke-width="0.75" opacity="0.25"/>
  <line x1="12" y1="17" x2="8" y2="26" stroke-width="0.75" opacity="0.2"/>
  <line x1="22" y1="20" x2="18" y2="28" stroke-width="0.75" opacity="0.3"/>
  <line x1="8" y1="26" x2="18" y2="28" stroke-width="0.75" opacity="0.25"/>
  <line x1="16" y1="5" x2="22" y2="20" stroke-width="0.75" opacity="0.15"/>
  <line x1="6" y1="8" x2="8" y2="26" stroke-width="0.75" opacity="0.15"/>
  <!-- Nodes -->
