  <circle cx="26" cy="10" r="1.2" opacity="0.5"/>
  <circle cx="12" cy="17" r="2.2" opacity="0.9"/>
  <circle cx="22" cy="20" r="1.8" opacity="0.7"/>
  <circle cx="8" cy="26" r="1.3" opacity="0.5"/>
  <circle cx="18" cy="28" r="1.6" opacity="0.6"/>
</svg>
